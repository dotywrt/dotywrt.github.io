name: Track ImmortalWrt Repo Updates

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest

    env:
      REPO: "chasey-dev/immortalwrt-ipq"
      BRANCH: "24.10-nss-mainline"
      ALLOWED_AUTHORS: "chasey-dev qosmio"
      STATE_FILE: ".last_commit_sha"

    steps:
      - name: Load last commit SHA
        id: load-sha
        run: |
          if [ -f "$STATE_FILE" ]; then
            LAST_SHA=$(cat "$STATE_FILE")
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
            echo "📄 Last recorded commit: $LAST_SHA"
          else
            echo "📄 No previous commit SHA found"
            echo "last_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Get latest commit info
        id: commit
        run: |
          echo "🔍 Checking latest commit for $REPO on branch $BRANCH..."
          DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/commits?sha=$BRANCH&per_page=1")

          if echo "$DATA" | jq -e '.[0]' >/dev/null 2>&1; then
            COMMIT_SHA=$(echo "$DATA" | jq -r '.[0].sha')
            AUTHOR=$(echo "$DATA" | jq -r '.[0].author.login // .[0].commit.author.name')
            DATE=$(echo "$DATA" | jq -r '.[0].commit.author.date')
            echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "author=$AUTHOR" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "Latest commit: $COMMIT_SHA by $AUTHOR on $DATE"
          else
            echo "❌ API error: $(echo "$DATA" | jq -r '.message // "Unknown error"')"
            exit 1
          fi

      - name: Stop if commit SHA is the same as last run
        run: |
          if [ "${{ steps.commit.outputs.commit_sha }}" = "${{ steps.load-sha.outputs.last_sha }}" ]; then
            echo "⏹ No new commit since last run."
            exit 0
          fi

      - name: Stop if commit is not from allowed authors
        run: |
          AUTHOR="${{ steps.commit.outputs.author }}"
          echo "Checking if '$AUTHOR' is allowed..."
          if ! echo "$ALLOWED_AUTHORS" | grep -qw "$AUTHOR"; then
            echo "⚠️ Commit author '$AUTHOR' not in allowed list: $ALLOWED_AUTHORS"
            exit 0
          fi
          echo "✅ Author '$AUTHOR' is allowed. Continuing..."

      - name: Get list of changed files
        run: |
          echo "📂 Fetching changed files for commit ${{ steps.commit.outputs.commit_sha }}"
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/commits/${{ steps.commit.outputs.commit_sha }}" \
            | jq -r '.files[].filename')

          if [ -z "$FILES" ]; then
            echo "⚠️ No changed files found for commit ${{ steps.commit.outputs.commit_sha }}"
            mkdir -p updates
            exit 0
          fi
          
          echo "Changed files:"
          echo "$FILES"

          mkdir -p updates
          git clone --depth 1 --branch $BRANCH https://github.com/$REPO.git repo_src
          
          for FILE in $FILES; do
            if [ -f "repo_src/$FILE" ]; then
              mkdir -p "updates/$(dirname "$FILE")"
              cp -v "repo_src/$FILE" "updates/$FILE"
            else
              echo "⚠️ Skipping missing/deleted file: $FILE"
            fi
          done
          
          echo "✅ Copied updated files into ./updates"

      - name: Save latest commit SHA for next run
        run: |
          echo "${{ steps.commit.outputs.commit_sha }}" > "$STATE_FILE"

      - name: Upload updated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-files
          path: updates
