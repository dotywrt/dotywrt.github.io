name: Track ImmortalWrt Repo Updates

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest

    env:
      REPO: "chasey-dev/immortalwrt-ipq"
      BRANCH: "24.10-nss-mainline"
      ALLOWED_AUTHORS: "chasey-dev qosmio"
      STATE_FILE: ".last_commit_sha"

    steps:
      - name: Load last commit SHA from cache
        id: load-sha
        uses: actions/cache@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: last-sha

      - name: Read last commit SHA
        id: read-sha
        run: |
          if [ -f "$STATE_FILE" ]; then
            LAST_SHA=$(cat "$STATE_FILE")
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
            echo "📄 Last recorded commit: $LAST_SHA"
          else
            echo "📄 No previous commit SHA found"
            echo "last_sha=" >> $GITHUB_OUTPUT
          fi

      - name: Get commits since last SHA
        id: get-commits
        run: |
          LAST_SHA="${{ steps.read-sha.outputs.last_sha }}"
          echo "🔍 Fetching commits for $REPO on branch $BRANCH since $LAST_SHA..."
          
          URL="https://api.github.com/repos/$REPO/commits?sha=$BRANCH&per_page=100"
          if [ -n "$LAST_SHA" ]; then
            # We just use 'since' timestamp here; if LAST_SHA doesn't exist locally, fallback to 0 epoch
            URL="$URL&since=$(date -u -d @$(git log -1 --format=%ct $LAST_SHA 2>/dev/null || echo 0) +%Y-%m-%dT%H:%M:%SZ)"
          fi

          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$URL")

          # Check if API returned an error
          if echo "$RESPONSE" | jq -e '.message?' >/dev/null; then
            echo "❌ GitHub API error: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi

          # Save commits array to file
          echo "$RESPONSE" | jq '.' > commits.json

          COUNT=$(jq length commits.json)
          echo "✅ Found $COUNT commits"
          jq -r '.[] | "\(.sha) \(.author.login // .commit.author.name)"' commits.json


      - name: Filter commits by allowed authors and copy updated files
        run: |
          mkdir -p updates
          git clone --depth 1 --branch $BRANCH https://github.com/$REPO.git repo_src

          jq -c '.[]' commits.json | while read commit; do
            SHA=$(echo "$commit" | jq -r '.sha')
            AUTHOR=$(echo "$commit" | jq -r '.author.login // .commit.author.name')

            if ! echo "$ALLOWED_AUTHORS" | grep -qw "$AUTHOR"; then
              echo "⏭ Skipping commit $SHA by $AUTHOR (not allowed)"
              continue
            fi

            echo "📦 Processing commit $SHA by $AUTHOR"
            FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/commits/$SHA" \
              | jq -r '.files[].filename')

            for FILE in $FILES; do
              if [ -f "repo_src/$FILE" ]; then
                mkdir -p "updates/$(dirname "$FILE")"
                cp -v "repo_src/$FILE" "updates/$FILE"
              else
                echo "⚠️ Skipping deleted/missing file: $FILE"
              fi
            done
          done

      - name: Save latest commit SHA
        run: |
          LATEST_SHA=$(jq -r '.[0].sha' commits.json)
          echo "$LATEST_SHA" > "$STATE_FILE"

      - name: Upload updated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-files
          path: updates
