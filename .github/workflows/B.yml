name: Build all packages for AW1000 (qualcommax/ipq807x)

on:
  workflow_dispatch:

jobs:
  build-ipk:
    runs-on: ubuntu-22.04

    env:
      TARGET: qualcommax
      SUBTARGET: ipq807x
      BUILD_DIR: openwrt-imagebuilder-24.10.0-qualcommax-ipq807x.Linux-x86_64
      OUT_DIR: openwrt/24.10/k66-r1x/packages

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev zlib1g-dev gawk git wget unzip python3 tar gzip xz-utils zstd

      - name: Download and extract ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/24.10.0/targets/qualcommax/ipq807x/openwrt-imagebuilder-24.10.0-qualcommax-ipq807x.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xf openwrt-imagebuilder-24.10.0-qualcommax-ipq807x.Linux-x86_64.tar.zst

      - name: Clone all packages from dotywrt/owrt-packages
        run: |
          git clone --depth=1 https://github.com/dotywrt/owrt-packages temp-packages
          mkdir -p $BUILD_DIR/files
          cp -r temp-packages/* $BUILD_DIR/files/

      - name: Create .config for AW1000 target
        run: |
          cd $BUILD_DIR
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_arcadyan_aw1000=y" >> .config
          make defconfig

      - name: Build dummy firmware to compile packages
        run: |
          cd $BUILD_DIR
          make image FILES=files/ PACKAGES=""

      - name: Copy compiled IPK files
        run: |
          mkdir -p $OUT_DIR
          find $BUILD_DIR/bin/packages/ -name "*.ipk" -exec cp {} $OUT_DIR/ \;

      - name: Generate Packages and Packages.gz
        run: |
          cd $OUT_DIR
          rm -f Packages Packages.gz Packages.manifest Packages.index.gz
          opkg-make-index . > Packages.manifest
          cp Packages.manifest Packages
          gzip -k Packages

      - name: Commit and push Packages index
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add $OUT_DIR/Packages*
          git commit -m "Update Packages index" || echo "No changes to commit"
          git push
