name: Build IPK + Firmware for AW1000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TARGET: qualcommax
      SUBTARGET: ipq807x
      PROFILE: arcadyan_aw1000
      SDK_DIR: openwrt-sdk-24.10.0-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64
      BUILD_DIR: openwrt-imagebuilder-24.10.0-qualcommax-ipq807x.Linux-x86_64
      OUT_DIR: openwrt/24.10/k66-r1x/packages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev zlib1g-dev gawk git wget unzip python3 tar gzip xz-utils zstd

      # --- SDK SECTION ---
      - name: Download OpenWrt SDK (GCC 13.3.0)
        run: |
          wget https://downloads.openwrt.org/releases/24.10.0/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/openwrt-sdk-24.10.0-${{ env.TARGET }}-${{ env.SUBTARGET }}_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xf openwrt-sdk-24.10.0-${{ env.TARGET }}-${{ env.SUBTARGET }}_gcc-13.3.0_musl.Linux-x86_64.tar.zst

      - name: Prepare SDK config and feeds
        run: |
          cd $SDK_DIR
          echo "CONFIG_TARGET_${TARGET}=y" > .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y" >> .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${PROFILE}=y" >> .config
          make defconfig

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone and symlink custom packages
        run: |
          cd $SDK_DIR
          git clone --depth=1 https://github.com/dotywrt/owrt-packages temp-packages

          for dir in temp-packages/luci-app-*; do
            [ -d "$dir" ] || continue
            appname=$(basename "$dir")
            echo "Symlinking $appname"
            ln -s ../../$dir package/$appname
          done

      - name: Compile luci-app-* packages
        run: |
          cd $SDK_DIR
          for dir in package/luci-app-*; do
            [ -d "$dir" ] || continue
            app=$(basename "$dir")
            echo "➡️ Building $app ..."
            make package/$app/compile V=s || exit 1
          done

      - name: Copy compiled IPK to workspace
        run: |
          mkdir -p ipk_out
          find $SDK_DIR/bin/packages/ -name "*.ipk" -exec cp {} ipk_out/ \;

      # --- IMAGEBUILDER SECTION ---
      - name: Download OpenWrt ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/24.10.0/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/openwrt-imagebuilder-24.10.0-${{ env.TARGET }}-${{ env.SUBTARGET }}.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xf openwrt-imagebuilder-24.10.0-${{ env.TARGET }}-${{ env.SUBTARGET }}.Linux-x86_64.tar.zst

      - name: Inject packages and build firmware
        run: |
          cd $BUILD_DIR
          mkdir -p packages
          cp ../ipk_out/*.ipk packages/
          mkdir -p files  # Add your custom files here if needed
          make image PROFILE="${PROFILE}" PACKAGES="" FILES="files/"

      # --- OUTPUT SECTION ---
      - name: Copy firmware and IPK to output
        run: |
          mkdir -p $OUT_DIR
          cp -v $BUILD_DIR/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.{bin,img} $OUT_DIR/ || true
          cp -v ipk_out/*.ipk $OUT_DIR/

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add $OUT_DIR/*.ipk || true
          git add $OUT_DIR/*.bin || true
          git add $OUT_DIR/*.img || true
          git commit -m "Build IPK & firmware for $PROFILE" || echo "No changes"
          git push
