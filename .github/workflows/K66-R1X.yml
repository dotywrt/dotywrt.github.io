name: Rebuild Package Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwrt/24.10/k66-r1x/packages/*.ipk'

jobs:
  regen-packages:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch opkg-make-index.sh from OpenWrt
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-make-index.sh -o scripts/ipkg-make-index.sh
          chmod +x scripts/ipkg-make-index.sh

      - name: List .ipk files
        run: |
          echo "Listing .ipk files:"
          find openwrt/24.10/k66-r1x/packages -name '*.ipk' -ls

      - name: Generate Packages and Packages.gz
        run: |
          cd openwrt/24.10/k66-r1x/packages
          bash ../../../scripts/ipkg-make-index.sh . > Packages
          gzip -kf Packages
          echo "Preview of Packages:"
          head Packages || echo "(Packages empty)"

      - name: Commit and push updated index
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add openwrt/24.10/k66-r1x/packages/Packages*
          git commit -m "Update Packages index" || echo "No changes to commit"
          git push
