name: Rebuild Package Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwrt/24.10/k66-r1x/packages/*.ipk'

jobs:
  regen-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenWrt index script
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/dotywrt/dotywrt.github.io/refs/heads/main/scripts/ipkg-make-index.py -o scripts/ipkg-make-index.py
          chmod +x scripts/ipkg-make-index.py

      - name: Generate Packages and Packages.gz
        run: |
          python3 scripts/ipkg-make-index.py openwrt/24.10/k66-r1x/packages > openwrt/24.10/k66-r1x/packages/Packages
          gzip -kf openwrt/24.10/k66-r1x/packages/Packages

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add openwrt/24.10/k66-r1x/packages/Packages*
          git commit -m "Update Packages index" || echo "No changes to commit"
          git push
