name: Rebuild Package Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwrt/24.10/k66-r1x/packages/*.ipk'

jobs:
  regen-packages:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Ubuntu version
        run: lsb_release -a

      - name: Install opkg-utils
        run: |
          sudo apt update
          sudo apt install -y opkg-utils

      - name: Debug: List .ipk files
        run: |
          echo "Listing .ipk files in openwrt/24.10/k66-r1x/packages:"
          find openwrt/24.10/k66-r1x/packages -name '*.ipk' -ls

      - name: Generate Packages and Packages.gz
        run: |
          cd openwrt/24.10/k66-r1x/packages
          opkg-make-index . > Packages
          gzip -kf Packages
          echo "---- Packages content preview ----"
          head Packages || echo "(Packages is empty)"
          echo "----------------------------------"

      - name: Commit and push updated index
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add openwrt/24.10/k66-r1x/packages/Packages*
          git commit -m "Update Packages index" || echo "No changes to commit"
          git push
