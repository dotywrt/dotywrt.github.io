name: Rebuild Package Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwrt/24.10/k66-r1x/packages/*.ipk'
      - 'scripts/ipkg-make-index.sh'

jobs:
  regen-packages:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Ensure Tools Are Installed
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils gzip xz-utils

      - name: Make Index
        run: |
          chmod +x scripts/ipkg-make-index.sh
          scripts/ipkg-make-index.sh openwrt/24.10/k66-r1x/packages > openwrt/24.10/k66-r1x/packages/Packages
          gzip -kf openwrt/24.10/k66-r1x/packages/Packages

      - name: Preview Packages file
        run: |
          echo "Preview Packages:"
          head openwrt/24.10/k66-r1x/packages/Packages || echo "(Empty)"
          echo
          echo "Preview Packages.gz:"
          zcat openwrt/24.10/k66-r1x/packages/Packages.gz | head || echo "(Empty)"

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"
          git add openwrt/24.10/k66-r1x/packages/Packages*
          git commit -m "🔄 Update Packages index" || echo "Nothing to commit"
          git push
